<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR 이해 리포트</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* 고정 템플릿 — 에이전트는 이 파일을 수정하지 않고 report.json 데이터만 채웁니다.
     저장소별 커스터마이즈는 스크립트 상단 REPO_LABEL/REPO_FULL/REPO_GITHUB_SLUG
     3개 상수뿐입니다(archive-template.html의 브랜딩 예외와 동일한 패턴). */
  :root {
    --bg: #0c0e0f; --sf: #131617; --tx: #e9eceb; --tx2: #cfd6d4; --mu: #8b9391;
    --bd: #22282a; --ac: #e0a85c; --acs: #2a2118; --acb: #3a2f20; --hv: #171b1d;
    --st-none: #5c6563; --st-changed: #e0a85c; --st-new: #8fd3c0; --st-removed: #e59aa8;
    --diff-add: rgba(143,211,192,.16); --diff-del: rgba(229,154,168,.16); --diff-hunk: rgba(224,168,92,.14);
  }
  :root[data-theme="light"] {
    --bg: #f3f5f4; --sf: #ffffff; --tx: #121614; --tx2: #3b4340; --mu: #6d7671;
    --bd: #e0e5e3; --ac: #96631a; --acs: #f6ecdc; --acb: #e6d5b8; --hv: #faf8f4;
    --st-none: #98a09d; --st-changed: #96631a; --st-new: #1f7a5c; --st-removed: #a8455a;
    --diff-add: rgba(31,122,93,.10); --diff-del: rgba(168,69,90,.10); --diff-hunk: rgba(150,99,26,.10);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* class-based display:flex/grid rules would otherwise override the hidden attribute */
  body {
    margin: 0; background: var(--bg); color: var(--tx);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6; word-break: keep-all;
  }
  a { color: var(--ac); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

  .top-bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px; background: var(--bg); border-bottom: 1px solid var(--bd);
  }
  .top-left { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .top-left .back-link { font-size: 13px; color: var(--mu); }
  .top-left .back-link:hover { color: var(--ac); }
  .top-left .divider { width: 1px; height: 14px; background: var(--bd); }
  .kicker { font-family: "Space Grotesk", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .18em; color: var(--ac); }
  #theme-toggle {
    border: 1px solid var(--bd); background: transparent; color: var(--mu); font: inherit;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  #theme-toggle:hover { color: var(--ac); border-color: var(--ac); }

  .page-wrap { max-width: 900px; margin: 0 auto; padding: 52px 24px 96px; }

  .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; font-size: 12px; color: var(--mu); }
  .meta-row .pr-num { font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 700; color: var(--ac); }
  .meta-row .head-sha { font-family: "Space Grotesk", sans-serif; }
  h1 { margin: 0 0 40px; font-size: clamp(1.5rem, 3.4vw, 2.1rem); font-weight: 700; line-height: 1.4; letter-spacing: -.02em; text-wrap: balance; }

  .section-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .section-head .rule { flex: 1 1 auto; height: 1px; background: var(--bd); min-width: 24px; }
  .section-head .hint { font-size: 12px; color: var(--mu); white-space: nowrap; }
  .step-chip { padding: 4px 11px; border-radius: 999px; background: var(--acs); color: var(--ac); font-size: 12px; font-weight: 700; white-space: nowrap; }

  section { margin-bottom: 56px; }

  .summary-card { padding: 30px 32px; background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; margin-bottom: 56px; }
  .summary-card .summary-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .summary-card .summary-head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .12em; color: var(--mu); white-space: nowrap; }
  .summary-list { display: flex; flex-direction: column; gap: 20px; }
  .summary-item { display: grid; grid-template-columns: 24px 1fr; gap: 14px; align-items: baseline; }
  .summary-item .n { font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 500; color: var(--ac); }
  .summary-item p { margin: 0; font-size: 16px; font-weight: 300; line-height: 1.9; color: var(--tx2); text-wrap: balance; }

  .pipeline-card { padding: 30px 30px 26px; background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; overflow-x: auto; }
  .pipeline-grid { display: flex; flex-direction: column; gap: 14px; min-width: 620px; }
  .pipeline-row { display: grid; gap: 18px; align-items: center; grid-template-columns: 110px 1fr; }
  .pipeline-row .lane-label { font-size: 12px; font-weight: 500; color: var(--mu); text-align: right; line-height: 1.5; }
  .pipeline-row .lane-nodes { display: grid; gap: 10px; padding-left: 18px; border-left: 1px solid var(--bd); }
  .node-slot { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .node-cell {
    padding: 13px 14px; border-radius: 9px; font: inherit; font-size: 13px; line-height: 1.5;
    text-align: center; text-wrap: balance; min-height: 48px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--bd); background: transparent; color: var(--mu); font-weight: 400;
  }
  .node-cell.empty { border-color: transparent; visibility: hidden; }
  .node-cell.on { font-weight: 600; cursor: default; }
  .node-cell.clickable { cursor: pointer; }
  .node-cell.is-selected { background: var(--acb); }
  .node-cell.is-focus { box-shadow: inset 0 0 0 2px currentColor; }

  .legend { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--bd); }
  .legend .lg-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mu); white-space: nowrap; }
  .legend .lg-item .sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; border: 1px solid var(--bd); }
  .legend .lg-hint { font-size: 12px; color: var(--mu); }

  .edge-list { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--bd); }
  .edge-list .edge-title { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--mu); }
  .edge-list .edge-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--tx2); }
  .edge-item .edge-arrow { color: var(--mu); }
  .edge-item .edge-status { color: var(--ac); font-size: 11px; }
  .edge-item.is-dashed { border-left: 2px dashed var(--bd); padding-left: 10px; }

  .node-detail { margin-top: 16px; padding: 26px 30px 30px; background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; }
  .node-detail .nd-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .node-detail .nd-head .sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .node-detail .nd-head h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .node-detail .nd-head .status-label { font-size: 12px; color: var(--mu); }
  .node-detail .asis-tobe { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .node-detail .asis-tobe { grid-template-columns: 1fr; } }
  .node-detail .box { padding: 20px 22px; background: var(--hv); border: 1px solid var(--bd); border-radius: 10px; }
  .node-detail .box.tobe { border-color: var(--acb); }
  .node-detail .box .tag { margin-bottom: 10px; font-family: "Space Grotesk", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--mu); }
  .node-detail .box.tobe .tag { color: var(--ac); }
  .node-detail .box p { margin: 0; font-size: 15px; font-weight: 300; line-height: 1.85; color: var(--tx2); text-wrap: balance; }
  .node-detail .nd-paths { margin-top: 14px; font-size: 12px; color: var(--mu); }

  .block-list { display: flex; flex-direction: column; gap: 12px; }
  .block-row { display: grid; grid-template-columns: 120px 1fr; gap: 20px; padding: 22px 26px; background: var(--sf); border: 1px solid var(--bd); border-radius: 12px; }
  @media (max-width: 600px) { .block-row { grid-template-columns: 1fr; } }
  .block-row .label { font-size: 13px; font-weight: 700; color: var(--tx); line-height: 1.7; }
  .block-row .content p { margin: 0 0 10px; font-size: 15px; font-weight: 300; line-height: 1.9; color: var(--tx2); text-wrap: balance; }
  .block-row .content p:last-child { margin-bottom: 0; }
  .block-row .content ul { margin: 0; padding-left: 20px; font-size: 15px; font-weight: 300; line-height: 1.85; color: var(--tx2); }
  .block-row .content ul li { margin-bottom: 6px; }

  .changes-toggle {
    border: 1px solid var(--bd); background: var(--sf); color: var(--ac); font: inherit; font-size: 13.5px;
    font-weight: 600; padding: 10px 18px; border-radius: 999px; cursor: pointer; margin-bottom: 16px;
  }
  .changes-toggle:hover { border-color: var(--ac); }
  .change-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .imp-badge { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; }
  .imp-badge.core     { background: color-mix(in srgb, var(--st-removed) 20%, transparent); color: var(--st-removed); }
  .imp-badge.contract { background: color-mix(in srgb, var(--st-changed) 20%, transparent); color: var(--st-changed); }
  .imp-badge.test     { background: color-mix(in srgb, var(--st-new) 20%, transparent); color: var(--st-new); }
  .imp-badge.docs     { background: color-mix(in srgb, var(--st-none) 20%, transparent); color: var(--mu); }
  .imp-badge.config   { background: transparent; color: var(--mu); border: 1px solid var(--bd); }
  .change-head .symbol { font-weight: 600; font-family: ui-monospace, monospace; font-size: 13.5px; }
  .change-head .file { color: var(--mu); font-size: 12px; font-family: ui-monospace, monospace; }
  .risk-note { margin-top: 12px; padding: 10px 14px; background: var(--acb); border-radius: 8px; font-size: 13.5px; color: var(--tx2); }
  .risk-note::before { content: "⚠ 리스크: "; font-weight: 700; color: var(--ac); }
  details.diff-box { margin-top: 12px; }
  details.diff-box summary { cursor: pointer; font-size: 13px; color: var(--ac); user-select: none; }
  pre.diff {
    margin: 10px 0 0; border: 1px solid var(--bd); border-radius: 8px; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55; padding: 0; background: var(--hv);
  }
  pre.diff .ln { display: block; padding: 0 12px; white-space: pre; }
  pre.diff .ln.add { background: var(--diff-add); }
  pre.diff .ln.del { background: var(--diff-del); }
  pre.diff .ln.hunk { background: var(--diff-hunk); color: var(--mu); }

  .qa-card { border-left: 3px solid var(--ac); background: var(--acs); border-radius: 0 10px 10px 0; padding: 18px 22px; font-size: 14.5px; color: var(--tx2); }

  .page-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--bd); font-size: 12px; color: var(--mu);
  }
  .page-footer .gh-link { font-size: 14px; font-weight: 500; }
  .page-footer .regen-note { flex-basis: 100%; }
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-left">
    <a href="../../" class="back-link">← 아카이브</a>
    <span class="divider"></span>
    <span class="kicker">PR REPORT</span>
  </div>
  <button type="button" id="theme-toggle">LIGHT</button>
</div>

<main class="page-wrap">
  <div class="meta-row" id="meta-row"></div>
  <h1 id="pr-title"></h1>

  <section class="summary-card" id="summary-card">
    <div class="summary-head"><h2>핵심 요약</h2></div>
    <div class="summary-list" id="summary-list"></div>
  </section>

  <section id="pipeline-section">
    <div class="section-head">
      <span class="step-chip">1단계</span><h2>전체 파이프라인에서의 위치</h2>
      <span class="rule"></span><span class="hint">as-is → to-be</span>
    </div>
    <div class="pipeline-card">
      <div class="pipeline-grid" id="pipeline-grid"></div>
      <div class="edge-list" id="edge-list" hidden></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="node-detail" id="node-detail" hidden></div>
  </section>

  <section id="easy-section">
    <div class="section-head"><span class="step-chip">2단계</span><h2>쉬운 설명</h2><span class="rule"></span></div>
    <div class="block-list" id="easy-list"></div>
  </section>

  <section id="changes-section">
    <div class="section-head"><span class="step-chip">3단계</span><h2>코드 기준 설명</h2><span class="rule"></span></div>
    <button type="button" id="changes-toggle" class="changes-toggle">코드 기준 상세 설명 펼치기</button>
    <div class="block-list" id="changes-list" hidden></div>
  </section>

  <section id="qa-section">
    <div class="section-head"><span class="step-chip">4단계</span><h2>이해도 확인</h2><span class="rule"></span></div>
    <div class="qa-card" id="qa-card"></div>
  </section>

  <footer class="page-footer" id="page-footer"></footer>

      item.appendChild(from);
      var arrow = document.createElement("span");
      arrow.className = "edge-arrow";
      arrow.textContent = edge.style === "dashed" ? "⇢" : "→";
      item.appendChild(arrow);
      var to = document.createElement("span");
      to.textContent = byId[edge.to].label;
      item.appendChild(to);
      if (edge.status && edge.status !== "unchanged") {
        var status = document.createElement("span");
        status.className = "edge-status";
        status.textContent = "(" + (STATUS_LABELS[edge.status] || edge.status) + ")";
        item.appendChild(status);
      }
      edgeList.appendChild(item);
    });
  }

  // legend
  var legend = document.getElementById("legend");
  ["unchanged", "modified", "added", "removed"].forEach(function (status) {
    var item = document.createElement("span");
    item.className = "lg-item";
    var sw = document.createElement("span");
    sw.className = "sw";
    sw.style.background = statusColor(status);
    item.appendChild(sw);
    item.appendChild(document.createTextNode(STATUS_LABELS[status]));
    legend.appendChild(item);
  });
  var legendHint = document.createElement("span");
  legendHint.className = "lg-hint";
  legendHint.textContent = "색칠된 노드를 클릭하면 as-is/to-be 설명이 표시됩니다";
  legend.appendChild(legendHint);

  // 기본 선택: focus 노드 중 상세가 있는 첫 항목, 없으면 변경된 노드 중 첫 항목
  var defaultNode =
    (r.pipeline.focus || []).map(function (id) { return byId[id]; })
      .filter(function (n) { return n && (n.as_is_ko || n.to_be_ko); })[0] ||
    nodes.filter(function (n) { return n.status !== "unchanged" && (n.as_is_ko || n.to_be_ko); })[0];
  if (defaultNode) showDetail(defaultNode, false);

  // ---------- 2단계: 쉬운 설명 ----------
  var easyList = document.getElementById("easy-list");

  function addBlock(label, buildContent) {
    var row = document.createElement("div");
    row.className = "block-row";
    var labelEl = document.createElement("span");
    labelEl.className = "label";
    labelEl.textContent = label;
    row.appendChild(labelEl);
    var content = document.createElement("div");
    content.className = "content";
    buildContent(content);
    row.appendChild(content);
    return row;
  }

  easyList.appendChild(addBlock("무슨 일이 있었나", function (content) {
    var ul = document.createElement("ul");
    r.plain_points_ko.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      ul.appendChild(li);
    });
    content.appendChild(ul);
  }));
  easyList.appendChild(addBlock("왜 필요했나", function (content) {
    var p = document.createElement("p");
    p.textContent = r.motivation_ko;
    content.appendChild(p);
  }));
  easyList.appendChild(addBlock("기대효과", function (content) {
    var ul = document.createElement("ul");
    r.expected_effects_ko.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      ul.appendChild(li);
    });
    content.appendChild(ul);
  }));

  // ---------- 3단계: 코드 기준 설명 ----------
  var changesToggle = document.getElementById("changes-toggle");
  var changesList = document.getElementById("changes-list");
  changesToggle.textContent = "코드 기준 상세 설명 펼치기 (" + r.changes.length + "건)";
  changesToggle.addEventListener("click", function () {
    var willShow = changesList.hidden;
    changesList.hidden = !willShow;
    changesToggle.textContent = (willShow ? "코드 기준 상세 설명 접기 (" : "코드 기준 상세 설명 펼치기 (") + r.changes.length + "건)";
  });

  r.changes.slice().sort(function (a, b) { return a.rank - b.rank; }).forEach(function (c) {
    changesList.appendChild(addBlock(c.module, function (content) {
      var head = document.createElement("div");
      head.className = "change-head";
      var badge = document.createElement("span");
      badge.className = "imp-badge " + c.importance;
      badge.textContent = c.importance;
      head.appendChild(badge);
      var symbol = document.createElement("span");
      symbol.className = "symbol";
      symbol.textContent = c.symbol;
      head.appendChild(symbol);
      var file = document.createElement("span");
      file.className = "file mono";
      file.textContent = c.file;
      head.appendChild(file);
      content.appendChild(head);

      var expl = document.createElement("p");
      expl.textContent = c.explanation_ko;
      content.appendChild(expl);

      if (c.risk_notes_ko) {
        var risk = document.createElement("div");
        risk.className = "risk-note";
        risk.textContent = c.risk_notes_ko;
        content.appendChild(risk);
      }

      if (c.diff_snippet) {
        var details = document.createElement("details");
        details.className = "diff-box";
        var summary = document.createElement("summary");
        summary.textContent = "diff 보기";
        details.appendChild(summary);
        var pre = document.createElement("pre");
        pre.className = "diff";
        c.diff_snippet.split("\n").forEach(function (line) {
          var span = document.createElement("span");
          var cls = "ln";
          if (line.indexOf("@@") === 0) cls += " hunk";
          else if (line.indexOf("+") === 0 && line.indexOf("+++") !== 0) cls += " add";
          else if (line.indexOf("-") === 0 && line.indexOf("---") !== 0) cls += " del";
          span.className = cls;
          span.textContent = line.length ? line : " ";
          pre.appendChild(span);
        });
        details.appendChild(pre);
        content.appendChild(details);
      }
    }));
  });

  // ---------- 4단계: 이해도 확인 ----------
  document.getElementById("qa-card").textContent = r.qa_note_ko;

  // ---------- footer ----------
  var footer = document.getElementById("page-footer");
  var repoInfo = document.createElement("span");
  repoInfo.textContent = REPO_FULL + " · PR #" + r.pr.number;
  footer.appendChild(repoInfo);
  var ghLink = document.createElement("a");
  ghLink.className = "gh-link";
  ghLink.href = "https://github.com/" + REPO_GITHUB_SLUG + "/pull/" + r.pr.number;
  ghLink.textContent = "GitHub에서 PR 보기 →";
  footer.appendChild(ghLink);
  var regenNote = document.createElement("span");
  regenNote.className = "regen-note";
  regenNote.textContent = "이 리포트는 pr-report 워크플로우가 자동 생성했습니다. 최신 상태가 아니면 PR에 /claude-report 코멘트로 재생성할 수 있습니다.";
  footer.appendChild(regenNote);
})();
</script>
</body>
</html>
