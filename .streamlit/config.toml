# Streamlit Experiment Workbench 테마.
#
# 색·모서리·테두리는 **여기가 정본**이다. `agent_orchestration/ui/styles.py`가 아니다.
# 이전에는 styles.py가 `var(--background-color)` 같은 Streamlit 테마 변수를 참조했지만
# Streamlit 1.60은 emotion CSS-in-JS로 계산된 값을 주입할 뿐 그런 전역 CSS 커스텀
# 속성을 노출하지 않는다. 참조가 전부 빈 값이라 해당 선언이 통째로 무시됐다(#657).
#
# 이 파일이 이미지에 실리려면 `deploy/agent_orchestration/ui.Dockerfile`이 복사해야
# 한다 — 그 Dockerfile은 경로를 열거해 복사하므로 저장소 루트에 두는 것만으로는
# 컨테이너에 들어가지 않는다.
#
# 방향은 "계기판"이다. 채도를 낮추고 대비를 면이 아니라 활자로 만든다. 강조색은 링크와
# 주요 버튼 하나에만 쓰고, 화면의 의미 있는 색은 상태 배지가 독점한다.

[theme]
backgroundColor = "#FCFCFC"
secondaryBackgroundColor = "#F4F5F5"
textColor = "#15181B"
# 원색에 가까운 강조색은 상태 배지와 경쟁한다. 거의 검정에 가까운 짙은 상록이라
# 버튼·탭 밑줄이 튀지 않으면서도 클릭 가능한 곳임을 알린다.
primaryColor = "#173F38"
linkColor = "#1B6B5B"
# 테두리는 존재를 알리는 정도까지만. 카드 네 개가 같은 굵기로 경쟁하면 위계가 죽는다.
borderColor = "#E4E6E7"

# 코드 배경은 밝게 둔다. 두 옵션은 인라인 코드와 `st.code` 블록에 함께 걸리는데,
# **글자색은 인라인에만 닿고 블록에는 닿지 않는다.** Streamlit 1.60의 `codeTextColor`는
# "defaults to the resolved value of `greenTextColor`"로 정의된 인라인 코드 계열 색이고,
# `st.code(..., language=None)`이 만드는 `<code class="language-plaintext">`는 하이라이팅
# 토큰 클래스가 없어 본문 `textColor`를 상속한다. 그래서 배경만 어둡게 잡으면 원본 로그
# 탭이 `#12232B` 바탕에 `#15181B` 글자가 되어 대비비 1.1:1로 읽히지 않았다(#687).
#
# 블록 글자색을 직접 지정할 방법이 테마에 없으므로 배경을 글자에 맞춘다. 블록은 본문
# `textColor`를 상속해 `#15181B`/`#F4F5F5` 대비 16.3:1이 된다.
#
# 인라인은 `codeTextColor`가 실제로 걸리는 유일한 곳이라 밝은 배경에 맞춰 다시 지정한다.
# 비워 두면 Streamlit 기본 초록으로 돌아가는데 이 배경에서 4.49:1이라 WCAG AA(4.5:1)에
# 못 미친다. `linkColor`와 같은 짙은 상록은 5.8:1로 AA를 넘기고 화면의 강조색 계열도
# 하나로 유지된다.
codeBackgroundColor = "#F4F5F5"
codeTextColor = "#1B6B5B"

# Noto Sans KR을 웹폰트로 싣는다. 가족 이름만 적으면 그 폰트가 깔린 PC에서만 적용돼
# 사람마다 다른 화면을 보게 된다. 브라우저가 Google Fonts에서 직접 받으므로 서버·
# 이미지에는 폰트를 넣지 않는다. 받지 못하면 폴백(styles.py의 `_BODY_FONT` 스택)으로
# 내려간다.
#
# 값에 `, sans-serif` 같은 폴백을 덧붙이지 않는다. Streamlit이 `<이름>:<URL>` 형식을
# 첫 콜론에서만 가르기 때문에 뒤에 붙인 폴백이 URL 질의문자열에 `%20sans-serif`로
# 딸려 들어간다. 지금은 Google이 무시해 주지만 기대할 동작이 아니다.
#
# 제목까지 sans로 통일한다. 세리프는 가설 본문 한 곳에만 쓴다(styles.py) — 화면
# 전체가 세리프면 제목마다 한글 폴백 자형이 섞여 통일감이 깨진다.
font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
headingFont = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
codeFont = "monospace"

# 0.5rem은 둥글어서 무르게 보인다. 계기판에는 각이 조금 더 선 편이 맞다.
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F7F8F8"
secondaryBackgroundColor = "#EDEFEF"
textColor = "#15181B"
primaryColor = "#173F38"
borderColor = "#E4E6E7"
