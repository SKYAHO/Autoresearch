[alembic]
script_location = %(here)s/migrations
# 저장소 루트를 sys.path 에 올린다. #754 로 이 파일이 한 단계 깊어져(`applications/`가
# 생겼다) `..` 로는 루트가 아니라 applications/ 를 가리키게 되므로 `../..` 이다.
prepend_sys_path = %(here)s/../..
path_separator = os
sqlalchemy.url = postgresql+psycopg://localhost/autoresearch

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
