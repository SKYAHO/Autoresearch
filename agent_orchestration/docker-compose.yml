services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: orch_user
      POSTGRES_PASSWORD: orch_password
      POSTGRES_DB: orch_orchestration
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orch_user -d orch_orchestration"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
