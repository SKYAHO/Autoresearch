data:
  path: data/processed/training_dataset.csv
  test_size: 0.2
  val_size: 0.2
  random_state: 42

model:
  # executor candidate는 이 config로 MLP를 선택한다. model_type이 없는 기존
  # config는 train.py에서 LightGBM으로 해석되어 champion 경로와 호환된다.
  model_type: MLP
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 31
  scale_pos_weight: auto
  random_state: 42
  mlp:
    hidden_layer_sizes: [32, 16]
    epochs: 200
    learning_rate: 0.001
    batch_size: 256
    l2: 0.0001
  # negative downsampling 비율 = negative를 남긴 비율(0<w≤1). 1.0이면 off(#300).
  # 0.1 = negative의 10%만 남김. sampling_rate < 1.0이면 scale_pos_weight는
  # 자동으로 1로 강제되고(이중 보정 방지), 출력 확률은 He 2014 보정으로 원분포
  # 복원된다. 설계: docs/specs/2026-07-24-negative-downsampling-calibration.md
  sampling_rate: 1.0

artifacts:
  model_path: artifacts/models/lgbm_model.joblib
  feature_columns_path: artifacts/models/feature_columns.json
  categorical_columns_path: artifacts/models/categorical_columns.json
  test_set_path: data/processed/test_set.csv

registry:
  model_name: ctr-model
  # calibration은 별도 등록 모델이 아니다(#390). downsampling(sampling_rate<1.0) 학습에서
  # main과 같은 run에 아티팩트(calibration/calibration.json)로 로깅되고, 서빙이 main run_id로
  # 함께 읽어 체이닝한다. 승격 기준은 main(ctr-model) 하나뿐 — 동기화(race) 문제를 없앤다.
