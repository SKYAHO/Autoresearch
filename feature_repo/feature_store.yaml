# Feast Feature Store 설정
# ============================================================================
# 환경별 값(GCP 프로젝트 ID, 버킷 경로 등)은 하드코딩하지 않고 환경 변수로
# 주입합니다. .env.example 을 복사해 .env 를 만들고 값을 채우세요.
# (아래 project 는 Feast 프로젝트 이름이므로 변경 금지 — 바꾸면 registry 가
# 분리됩니다. prod/dev 는 GCS_REGISTRY_PATH 경로로 격리하므로 project 는
# 공통입니다. #399)
# ============================================================================

project: autoresearch_feature_store

# Registry: FeatureView 메타데이터(Entity, Feature 스키마 등)를 저장하는 위치
# GCS 버킷에 저장하여 팀 전체가 하나의 Registry 를 공유
registry:
  registry_type: file
  path: ${GCS_REGISTRY_PATH}

provider: gcp

# Offline Store: BigQuery
offline_store:
  type: bigquery
  dataset: ${BQ_DATASET}
  project_id: ${GCP_PROJECT_ID}
  gcs_staging_location: ${GCS_STAGING_LOCATION}

# Online Store: Memorystore for Redis Cluster (IAM 인증·TLS)
# REDIS_HOST/REDIS_PORT 는 cluster discovery endpoint 값이다.
# 어댑터 구현·인증 방식은 feature_repo/redis_iam.py 참조.
online_store:
  type: feature_repo.redis_iam.IAMRedisOnlineStore
  redis_type: redis_cluster
  connection_string: ${REDIS_HOST}:${REDIS_PORT}
  tls_ca_cert_path: ${REDIS_TLS_CA_PATH}
  # apply 시 삭제된 FeatureView 의 Redis 키/필드를 정리한다. Redis 키는
  # 엔티티 단위라 FV 들이 공유하므로, Feast 는 그 키를 쓰는 FV 가 하나뿐이면
  # 키를 삭제하고 공유 중이면 해당 FV 의 해시 필드만 지운다(hdel). 이 스캔은
  # Redis 접속을 요구하므로 apply 는 VPC 안에서 도는 셀프 호스티드 러너에서
  # 직접 실행한다(#561).
  #
  # prod/dev 환경 분리(#399): 이 값을 환경 파생으로 주입한다. prod=true(고아 키
  # GC 유지), dev=false. dev(오토리서치 오프라인 실험)는 온라인 서빙이 없고,
  # full_scan=false 면 apply 가 Redis 에 아예 접속하지 않아 dev registry apply 가
  # prod Redis 를 건드리지 않는다. 미설정 시 feature_repo/env.py 가
  # AUTORESEARCH_ENV(기본 prod)에서 파생해 setdefault 하며, bare `feast` CLI 경로
  # (feast-apply.yml)에서는 FEAST_ONLINE_FULL_SCAN_FOR_DELETION 을 직접 주입한다.
  full_scan_for_deletion: ${FEAST_ONLINE_FULL_SCAN_FOR_DELETION}
  # 모든 키 쓰기에 7일 EXPIRE 를 거는 심층 방어. 엔티티 자체가 폐기되어
  # 아무도 쓰지 않게 된 키를 소멸시킨다. 살아있는 FV 와 엔티티를 공유하는
  # 고아 필드는 매일 materialize 가 TTL 을 리셋하므로 TTL 로는 지워지지
  # 않으며, 그 경로는 위 full_scan_for_deletion 이 담당한다. materialize 가
  # 7일 이상 연속 실패하면 서빙 키가 만료된다.
  key_ttl_seconds: 604800

entity_key_serialization_version: 3

# Feature 정의 파일 (이 디렉토리 내의 모든 *.py 파일에서 Entity, FeatureView 로드)