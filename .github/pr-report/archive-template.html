<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Autoresearch의 merge된 PR 이해 리포트 아카이브">
<title>PR Report Archive · Autoresearch</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --border: #d1d9e0;
    --text: #1f2328;
    --muted: #59636e;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --shadow: 0 1px 2px rgba(31, 35, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8d96a0;
      --accent: #4493f8;
      --accent-soft: #0c2d6b;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  .archive-shell {
    width: min(100% - 32px, 920px);
    margin: 0 auto;
    padding: clamp(32px, 7vw, 72px) 0 80px;
  }
  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 3rem);
    line-height: 1.15;
    letter-spacing: -.035em;
  }
  .intro {
    max-width: 640px;
    margin: 16px 0 0;
    color: var(--muted);
  }
  .toolbar {
    margin: 32px 0 20px;
  }
  .toolbar label {
    display: block;
    margin-bottom: 8px;
    font-size: .85rem;
    font-weight: 650;
  }
  #archive-search {
    width: 100%;
    min-height: 46px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    outline: none;
  }
  #archive-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .archive-count {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: .86rem;
  }
  .category-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tab-button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-button.is-selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .pr-category {
    flex: 0 0 auto;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: .72rem;
    font-weight: 700;
  }
  #report-list {
    display: grid;
    gap: 14px;
  }
  .report-card {
    padding: clamp(18px, 4vw, 24px);
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .card-heading {
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .pr-number {
    flex: 0 0 auto;
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: .86rem;
    font-weight: 700;
  }
  .pr-title {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  .report-meta {
    display: flex;
    gap: 12px;
    margin: 8px 0 16px;
    color: var(--muted);
    font-size: .8rem;
  }
  .summary-list {
    margin: 0;
    padding-left: 22px;
    font-size: .92rem;
  }
  .summary-list li + li { margin-top: 5px; }
  .report-link {
    display: inline-block;
    margin-top: 18px;
    color: var(--accent);
    font-size: .86rem;
    font-weight: 650;
    text-decoration: none;
  }
  .report-link:hover { text-decoration: underline; }
  #empty-state {
    padding: 48px 20px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 560px) {
    .archive-shell { width: min(100% - 24px, 920px); }
    .card-heading { display: block; }
    .pr-number { display: block; margin-bottom: 4px; }
    .report-meta { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<main class="archive-shell">
  <header>
    <p class="eyebrow">Autoresearch</p>
    <h1>PR Report Archive</h1>
    <p class="intro">
      merge된 변경의 목적과 파이프라인 영향을 빠르게 되짚어보는
      PR 이해 리포트 모음입니다.
    </p>
  </header>

  <section class="toolbar" aria-label="아카이브 검색">
    <div class="category-tabs" id="category-tabs" role="tablist" aria-label="카테고리 필터">
      <button type="button" class="tab-button is-selected" data-category="all" role="tab" aria-selected="true">전체</button>
      <button type="button" class="tab-button" data-category="application" role="tab" aria-selected="false">Application</button>
      <button type="button" class="tab-button" data-category="airflow" role="tab" aria-selected="false">Airflow</button>
    </div>
    <label for="archive-search">PR 번호·제목·작성자 검색</label>
    <input
      id="archive-search"
      type="search"
      placeholder="예: 345, ONNX, waieiches"
      autocomplete="off"
    >
    <p class="archive-count"><strong id="report-count">0</strong>개의 merge 리포트</p>
  </section>

  <p id="empty-state" hidden>검색 결과가 없습니다.</p>
  <section id="report-list" aria-label="merge된 PR 리포트" aria-live="polite"></section>
</main>

<script id="archive-data" type="application/json">/*__ARCHIVE_DATA__*/</script>
<script src="./archive.js"></script>
</body>
</html>
