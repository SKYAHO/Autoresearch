<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Autoresearch의 merge된 PR 이해 리포트 아카이브">
<title>PR Report Archive · Autoresearch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root {
    --bg: #0c0e0f; --sf: #131617; --tx: #e9eceb; --tx2: #cfd6d4; --mu: #8b9391;
    --bd: #22282a; --ac: #8fd3c0; --hv: #14181a;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f4; --sf: #ffffff; --tx: #121614; --tx2: #3b4340; --mu: #6d7671;
    --bd: #e0e5e3; --ac: #1f7a5c; --hv: #eaefec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--tx);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    word-break: keep-all;
  }
  a { color: var(--ac); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select { font-family: inherit; }
  mark { background: color-mix(in srgb, var(--ac) 30%, transparent); color: inherit; border-radius: 2px; }

  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- rail (left) ---------- */
  .rail { display: flex; flex-direction: column; width: 44%; min-width: 320px; max-width: 560px; border-right: 1px solid var(--bd); }
  .rail-head { padding: 28px 26px 18px; }
  .rail-head-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .kicker { font-family: "Space Grotesk", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--ac); white-space: nowrap; }
  #theme-toggle {
    border: 1px solid var(--bd); background: transparent; color: var(--mu);
    font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 6px 12px;
    border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  #theme-toggle:hover { color: var(--ac); border-color: var(--ac); }
  .rail-count { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .rail-count .n { font-family: "Space Grotesk", sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .rail-count .of { font-size: 13px; color: var(--mu); white-space: nowrap; }
  .repo-stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .repo-stat {
    display: flex; align-items: center; gap: 7px; padding: 0 0 5px; border: 0; border-bottom: 2px solid transparent;
    background: transparent; color: var(--mu); font: inherit; font-size: 13px; font-weight: 400; cursor: pointer; white-space: nowrap;
  }
  .repo-stat:hover { color: var(--tx); }
  .repo-stat.on { color: var(--tx); font-weight: 700; border-bottom-color: currentColor; }
  .repo-stat .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }

  .rail-filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 26px 16px; }
  .rail-filters input[type="search"] {
    flex: 1 1 100%; min-width: 140px; height: 36px; padding: 0 14px; border: 1px solid var(--bd);
    border-radius: 999px; background: var(--sf); color: var(--tx); font-size: 13px; outline: none;
  }
  .rail-filters select {
    flex: 1 1 120px; height: 36px; min-width: 100px; padding: 0 8px; border: 1px solid var(--bd);
    border-radius: 999px; background: var(--sf); color: var(--mu); font-size: 12px;
  }
  .rail-filters select#sort-select { flex: 0 1 auto; }

  .rail-list { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .rail-group-label {
    position: sticky; top: 0; z-index: 1; padding: 12px 26px 8px; background: var(--bg);
    font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--mu); white-space: nowrap;
  }
  .rail-item {
    position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 14px;
    padding: 13px 26px 15px; cursor: pointer;
  }
  .rail-item:hover { background: var(--hv); }
  .rail-item .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .rail-item .num { font-family: "Space Grotesk", sans-serif; font-size: 14px; font-weight: 500; color: var(--mu); padding-top: 2px; }
  .rail-item .title { font-size: 15px; font-weight: 500; line-height: 1.6; }
  .rail-item .item-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 12px; color: var(--mu); white-space: nowrap; }
  .rail-item .item-meta .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .rail-empty { margin: 36px 26px; padding: 34px 18px; border: 1px solid var(--bd); border-radius: 12px; text-align: center; font-size: 13px; color: var(--mu); }
  .rail-status { margin: 0 26px 14px; font-size: 12.5px; color: var(--mu); }
  .rail-list-tail { height: 40px; }

  /* ---------- detail (right) ---------- */
  .detail { flex: 1 1 auto; min-width: 0; overflow: auto; background: var(--sf); }
  .detail-inner { max-width: 640px; padding: 52px 48px 64px; }
  .detail-back { display: none; }
  .detail-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; white-space: nowrap; flex-wrap: wrap; }
  .detail-meta .repo-tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .detail-meta .num, .detail-meta .author, .detail-meta .date { font-size: 13px; color: var(--mu); }
  .detail-meta .num { font-family: "Space Grotesk", sans-serif; }
  .detail h2 { margin: 0 0 30px; font-size: 29px; font-weight: 700; line-height: 1.45; letter-spacing: -.02em; text-wrap: balance; }
  .detail-bullets { display: flex; flex-direction: column; gap: 22px; }
  .bullet { display: grid; grid-template-columns: 8px 1fr; gap: 16px; align-items: start; }
  .bullet .dot { width: 8px; height: 8px; margin-top: 11px; border-radius: 50%; background: var(--ac); }
  .bullet p { margin: 0; font-size: 16px; font-weight: 300; line-height: 1.9; color: var(--tx2); text-wrap: balance; }
  .detail-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--bd); }
  .detail-foot .repo-full { font-size: 12px; color: var(--mu); }
  .detail-foot a { font-size: 14px; font-weight: 500; }
  .detail-empty { padding: 52px 48px; color: var(--mu); font-size: 14px; }

  @media (max-width: 760px) {
    .app { position: relative; }
    .rail { width: 100%; max-width: none; min-width: 0; }
    .detail {
      position: fixed; inset: 0; z-index: 20; transform: translateX(100%); transition: transform .2s ease;
    }
    .detail.is-open { transform: translateX(0); }
    .detail-inner { padding: 20px 20px 48px; max-width: none; }
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; border: 0; background: none;
      color: var(--mu); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;
    }
    .detail h2 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-head-top">
        <span class="kicker">MERGE LOG</span>
        <button type="button" id="theme-toggle">LIGHT</button>
      </div>
      <div class="rail-count">
        <span class="n" id="count-num">0</span>
        <span class="of">/ 전체 <span id="total-num">0</span>건 중</span>
      </div>
      <div class="repo-stats" id="repo-stats"></div>
    </div>
    <div class="rail-filters">
      <input type="search" id="q" placeholder="검색" autocomplete="off">
      <select id="author-select"></select>
      <select id="sort-select">
        <option value="recent">최신순</option>
        <option value="repo">저장소순</option>
      </select>
    </div>
    <p class="rail-status" id="rail-status" hidden></p>
    <div class="rail-list" id="rail-list"></div>
  </aside>
  <main class="detail" id="detail"></main>
</div>

<script id="archive-data" type="application/json">/*__ARCHIVE_DATA__*/</script>
<script src="./archive.js"></script>
</body>
</html>
