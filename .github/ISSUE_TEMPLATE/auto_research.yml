name: Auto Research (에이전트 자율 실험)
description: 에이전트가 읽고 직접 수행할 실험 가설을 등록합니다.
title: "[AR] "
labels: ["experiment", "auto-research"]
body:
  - type: markdown
    attributes:
      value: |
        **이 템플릿은 에이전트가 읽고 실행합니다.** 사람이 결과를 기록하는 일반 실험은
        `Experiment` 템플릿을 쓰세요.

        흐름: 이 이슈 등록 → 에이전트가 읽음 → 실험 수행 → 과정·로그는 코멘트로,
        결과 요약은 본문 맨 아래 `결과` 항목에 채워 넣음 → 이슈 종료. 판정과 MLflow run을
        나중에 훑을 때의 **정본은 본문**이고, 코멘트는 과정 기록입니다.

        아래 필드는 #396 최소 흐름 1회 완주에서 **실제로 필요했던 것만** 남긴 것입니다.

  - type: textarea
    id: hypothesis
    attributes:
      label: 연구 가설
      description: |
        무엇이 왜 개선될 것이라 보는지. 에이전트의 실험 설계 전부가 여기서 나옵니다.
        "왜 그렇게 생각하는지"(근거)까지 적으면 에이전트가 검증 방법을 좁힐 수 있습니다.
      placeholder: |
        예) LightGBM은 축 정렬 분할만 하므로 두 피처의 비율을 스스로 만들지 못한다.
        따라서 views_per_day = view_count / (days_since_upload + 1)을 입력에 추가하면
        baseline 대비 test ROC-AUC가 개선된다.
    validations:
      required: true

  - type: input
    id: experiment_id
    attributes:
      label: 실험 식별자
      description: |
        같은 이슈에서 여러 실험을 구분할 이름입니다. 영문 소문자·숫자·하이픈만
        사용하며, 입력하지 않으면 primary를 사용합니다.
      value: primary
      placeholder: primary
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 변경할 피처 · 모델
      description: |
        에이전트가 그대로 코드로 옮길 수 있을 만큼 구체적으로. 파생 피처는 **계산식**을,
        하이퍼파라미터는 **바꿀 값과 기준값**을 적습니다. 변경하지 않는 것도 명시하세요
        (변수가 하나여야 효과를 분리할 수 있습니다).
      value: |
        - 추가/변경할 피처 (계산식):
        - 변경할 하이퍼파라미터 (없으면 "없음"):
        - baseline과 동일하게 유지할 것:
    validations:
      required: true

  - type: input
    id: primary_metric_name
    attributes:
      label: 주 지표 이름
      description: 자동 판정에 쓸 MLflow metric key를 정확히 적습니다.
      placeholder: 예) val_roc_auc
    validations:
      required: true

  - type: dropdown
    id: primary_metric_direction
    attributes:
      label: 주 지표 방향
      description: 값이 클수록 좋은지, 작을수록 좋은지 선택합니다.
      options:
        - higher_is_better
        - lower_is_better
      default: 0
    validations:
      required: true

  - type: input
    id: minimum_primary_delta
    attributes:
      label: baseline 대비 최소 개선폭
      description: 0 이상의 decimal만 입력합니다. 통과 조건은 이 값 이상 개선입니다.
      placeholder: "0.002"
    validations:
      required: true

  - type: input
    id: guardrail_metric_name
    attributes:
      label: Guardrail 지표 이름 (선택)
      description: 주 지표가 좋아도 과도하게 나빠지면 승격하지 않을 보조 지표입니다.
      placeholder: 없음
    validations:
      required: false

  - type: dropdown
    id: guardrail_metric_direction
    attributes:
      label: Guardrail 지표 방향
      description: guardrail 지표를 쓰지 않으면 not_applicable을 선택합니다.
      options:
        - not_applicable
        - higher_is_better
        - lower_is_better
      default: 0
    validations:
      required: true

  - type: input
    id: maximum_guardrail_regression
    attributes:
      label: Guardrail 허용 최대 비열화 (선택)
      description: 0 이상의 decimal입니다. guardrail 지표를 쓰지 않으면 없음으로 둡니다.
      placeholder: 없음
    validations:
      required: false

  - type: input
    id: secondary_metrics
    attributes:
      label: 보조 관측 지표
      description: 판정에는 쓰지 않지만 함께 기록할 지표입니다.
      placeholder: 예) PR-AUC, LogLoss, feature importance 순위
    validations:
      required: false

  - type: dropdown
    id: comparison
    attributes:
      label: 비교 대상
      description: |
        `champion`(MLflow `ctr-model@champion`)은 **다른 기간·다른 데이터 스냅샷**으로
        학습됐을 수 있어, 변경 1개의 효과를 분리하지 못합니다. 특별한 이유가 없으면
        "동일 조건 baseline 재학습"을 고르세요(#396 회고).
      options:
        - 동일 조건 baseline 재학습 (권장)
        - champion (ctr-model@champion)
        - 둘 다
      default: 0
    validations:
      required: true

  - type: textarea
    id: reproducibility
    attributes:
      label: 재현 조건 고정값
      description: |
        baseline과 변경군의 A/B가 성립하려면 split·seed가 같아야 합니다.
        시드 1개로 1회만 돌리면 지표 차이가 노이즈인지 판정할 수 없어(#396이 그 사례),
        기본값을 시드 3개로 둡니다. 줄이려면 그 이유를 가설에 적으세요.
      value: |
        - test_size / val_size: 0.2 / 0.2
        - 시드 목록: 42, 43, 44
        - 반복 시드 수: 3
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: 대상 데이터 · 기간
      description: |
        ⚠️ **현재 에이전트는 이 필드를 지키지 못할 수 있습니다.** 정규 조립 경로
        (`python -m src.cli build-features` → Feast offline PIT)는 BigQuery spine과 GCS
        레지스트리 자격 증명이 필요해 로컬 에이전트가 실행할 수 없습니다(#396 B3 ①).
        기간을 지정해도 에이전트가 기존 CSV 스냅샷을 재사용할 수 있으니, 실제로 무엇을
        썼는지는 아래 `스냅샷 재사용`과 결과 항목에서 확인하세요.
      value: |
        - 데이터셋 / 경로:
        - 기간 (KST YYYY-MM-DD ~ YYYY-MM-DD):
    validations:
      required: true

  - type: dropdown
    id: snapshot_reuse
    attributes:
      label: 스냅샷 재사용
      description: |
        위 기간을 정규 조립 경로로 만들지 못했을 때, 에이전트가 기존 CSV 스냅샷으로
        진행해도 되는지입니다. "불허"면 조립에 실패한 시점에 중단하고 막힌 지점을
        코멘트로 남깁니다.
      options:
        - 허용 (진행하되 실제로 쓴 데이터를 결과에 명시)
        - 불허 (정규 조립 경로 실패 시 중단)
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: allowed_scope
    attributes:
      label: 허용 범위
      description: |
        에이전트가 어디까지 건드려도 되는지 **미리** 합의합니다. #396에서는 피처 1개 추가로
        `MODEL_FEATURE_COLUMNS`를 고쳐야 했고, 그 결과 학습·시뮬레이션·일일추천·서빙 테스트
        43개가 추가로 실패했습니다.

        **미체크는 불허입니다.** 실험이 성립하려면 미체크 항목을 건드려야 한다고 판단되면,
        에이전트는 진행하지 않고 이 이슈에 질문 코멘트를 남기고 대기합니다.

        첫 항목이 **미체크**면 계약을 고치는 대신 `--extra-features`로 실험 피처를 얹습니다(#405).
        prod 계약 뒤에 덧붙는 방식이라 테스트 43개가 깨지지 않고, 그렇게 학습한 모델은
        champion 승격이 자동으로 차단됩니다. 단 데이터셋에 **이미 있는** 컬럼만 지정할 수
        있습니다 — 컬럼을 새로 만들려면 Feast 정의가 필요하며 두 번째 항목의 허용 범위입니다.
      options:
        - label: prod 모델 계약(`src/features/model_contract.py`) 수정을 허용한다
        - label: Feast 정의(`feature_repo/`) 수정을 허용한다
        - label: 실험 결과를 champion으로 승격하는 것까지 검토한다

  - type: textarea
    id: result
    attributes:
      label: 결과 (에이전트가 채웁니다)
      description: |
        사람이 미리 채우지 않습니다. 에이전트가 실험을 마치면 **이 본문 항목을 채워
        이슈를 갱신하고**(과정·로그는 별도 코멘트) 종료합니다. 나중에 판정·MLflow run을
        모을 때 읽는 정본은 본문의 이 항목입니다.
      value: |
        - 판정 (지지/기각):
        - 지표 요약 (baseline 대비):
        - 실제 사용 데이터 (스냅샷 재사용 여부 포함):
        - MLflow run (tracking URI / experiment / run_id / registry 모델 이름):
        - 막힌 지점 (= 스킬/인프라 백로그):
    validations:
      required: false
