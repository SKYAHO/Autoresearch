name: feast-apply

# #346 이후 apply는 GHA 러너가 아니라 VPC 안의 GKE Job에서 실행된다. 러너는
# VPC 밖이라 private Redis(PSC)에 닿지 못해 `full_scan_for_deletion: true`가
# 요구하는 online store 삭제 스캔을 수행할 수 없기 때문이다. 이 워크플로우는
# Job을 만들고 결과를 판정하는 역할만 한다. main은 prod, dev는 dev registry를
# 반영하며, 소유 경계("registry apply는 GHA, materialize는 Airflow")는 그대로다.

on:
  push:
    branches: [main, dev]
    paths:
      - feature_repo/feature_definitions.py
      - feature_repo/feature_store.yaml
      - feature_repo/.feastignore
      - feature_repo/redis_iam.py
      - feature_repo/bootstrap.py
      - feature_repo/env.py
      - deploy/feast/apply-job.yaml
      - scripts/fetch_redis_ca.py
      # apply 후 검증 스크립트. 이게 빠져 있으면 게이트만 고친 커밋이 다음 정의 변경
      # 전까지 한 번도 실행되지 않는다.
      - scripts/verify_registry_portability.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/feast-apply.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "apply 대상 환경 (prod|dev, #399). push는 브랜치(main/dev)와 같은 환경."
        type: choice
        default: prod
        options:
          - prod
          - dev

permissions:
  contents: read

concurrency:
  group: feast-apply
  cancel-in-progress: false

jobs:
  feast-apply:
    name: Apply Feast feature definitions to registry
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write

    env:
      # infra#346이 확정한 전용 namespace/KSA 계약값. Job을 만들 수 있는 주체가
      # feast-apply GSA로만 실행할 수 있도록 namespace를 분리했다.
      FEAST_APPLY_NAMESPACE: ${{ vars.FEAST_APPLY_NAMESPACE || 'feast-apply' }}
      FEAST_APPLY_SERVICE_ACCOUNT: ${{ vars.FEAST_APPLY_SERVICE_ACCOUNT || 'feast-apply' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.FEAST_APPLY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate required configuration
        # Redis 관련 값은 러너가 직접 쓰지 않고 Job env로 주입되지만, 누락되면
        # Pod 안에서야 실패하므로 여기서 먼저 막는다.
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          FEAST_IMAGE_TAG: ${{ vars.FEAST_IMAGE_TAG }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GKE_LOCATION: ${{ vars.GKE_LOCATION }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          GCS_STAGING_LOCATION: ${{ vars.GCS_STAGING_LOCATION }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_CA_SECRET_ID: ${{ vars.REDIS_CA_SECRET_ID }}
          CODE_ARTIFACTS_BUCKET: ${{ secrets.CODE_ARTIFACTS_BUCKET }}
        shell: bash
        run: |
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY FEAST_IMAGE_TAG \
            GKE_CLUSTER_NAME GKE_LOCATION BQ_DATASET GCS_REGISTRY_PATH \
            GCS_STAGING_LOCATION REDIS_HOST REDIS_PORT REDIS_CA_SECRET_ID \
            CODE_ARTIFACTS_BUCKET
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::$variable_name is not configured"
              exit 1
            fi
          done

      - name: Wait for the code archive of this commit
        # code-archive.yml과 이 워크플로우는 둘 다 main push에 트리거되고
        # concurrency 그룹이 분리돼 병렬로 돈다. 아카이브 업로드를 기다리지
        # 않으면 Job이 NotFound로 죽거나(SHA 고정), code/latest.txt를 통해
        # 직전 커밋의 정의로 apply하고도 registry generation이 바뀌어 침묵
        # 실패 가드를 통과해 버린다.
        env:
          CODE_ARTIFACTS_BUCKET: ${{ secrets.CODE_ARTIFACTS_BUCKET }}
          CODE_ARCHIVE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          archive_uri="gs://${CODE_ARTIFACTS_BUCKET}/code/${CODE_ARCHIVE_SHA}.tar.gz"
          for _ in $(seq 1 60); do
            if gcloud storage objects describe "$archive_uri" >/dev/null 2>&1; then
              echo "code archive ready: $archive_uri"
              exit 0
            fi
            sleep 10
          done
          echo "::error::code archive not found after 10m: $archive_uri"
          echo "::error::run the 'Code archive upload' workflow for this commit first"
          exit 1

      - name: Record registry generation before apply
        id: before
        env:
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
        shell: bash
        run: |
          generation="$(gcloud storage objects describe "$GCS_REGISTRY_PATH" \
            --format='value(generation)' 2>/dev/null || true)"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Get GKE credentials
        # 컨트롤 플레인은 공개 DNS 엔드포인트 + IAM으로 검증되므로 VPC 밖에서도
        # Job 생성이 가능하다. VPC 안이어야 하는 것은 Redis 데이터 경로뿐이다.
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          use_dns_based_endpoint: true

      - name: Render Job manifest
        id: manifest
        env:
          FEAST_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/autoresearch-feast:${{ vars.FEAST_IMAGE_TAG }}
          CODE_ARCHIVE_SHA: ${{ github.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          GCS_STAGING_LOCATION: ${{ vars.GCS_STAGING_LOCATION }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_CA_SECRET_ID: ${{ vars.REDIS_CA_SECRET_ID }}
          CODE_ARTIFACTS_BUCKET: ${{ secrets.CODE_ARTIFACTS_BUCKET }}
          # prod/dev 환경 분리(#399). push는 main→prod/dev→dev로 고정하고 수동
          # dispatch만 입력값을 선택한다. FEAST_ONLINE_FULL_SCAN_FOR_DELETION 은 feature_repo/env.py 의
          # 파생 규칙과 동일하게 계산한다(prod=true, dev=false). dev=false 면 apply 가
          # Redis 에 접속하지 않아 dev registry apply 가 prod Redis 를 건드리지 않는다.
          AUTORESEARCH_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
        shell: bash
        run: |
          # Job 이름은 63자 제한이 있어 커밋 SHA 앞 12자만 쓴다.
          FEAST_APPLY_JOB_NAME="feast-apply-${CODE_ARCHIVE_SHA:0:12}"
          export FEAST_APPLY_JOB_NAME
          # env.py 의 파생 규칙을 그대로 재현한다(prod=true, dev=false).
          if [[ "$AUTORESEARCH_ENV" == "dev" ]]; then
            FEAST_ONLINE_FULL_SCAN_FOR_DELETION="false"
          else
            FEAST_ONLINE_FULL_SCAN_FOR_DELETION="true"
          fi
          export FEAST_ONLINE_FULL_SCAN_FOR_DELETION
          envsubst '
            ${FEAST_APPLY_JOB_NAME} ${FEAST_APPLY_NAMESPACE}
            ${FEAST_APPLY_SERVICE_ACCOUNT} ${FEAST_IMAGE}
            ${CODE_ARTIFACTS_BUCKET} ${CODE_ARCHIVE_SHA} ${GCP_PROJECT_ID}
            ${BQ_DATASET} ${GCS_REGISTRY_PATH} ${GCS_STAGING_LOCATION}
            ${REDIS_HOST} ${REDIS_PORT} ${REDIS_CA_SECRET_ID}
            ${AUTORESEARCH_ENV} ${FEAST_ONLINE_FULL_SCAN_FOR_DELETION}
          ' < deploy/feast/apply-job.yaml > job.yaml
          if grep -n '\${' job.yaml; then
            echo "::error::unresolved placeholder in the rendered Job manifest"
            exit 1
          fi
          echo "job_name=$FEAST_APPLY_JOB_NAME" >> "$GITHUB_OUTPUT"
          cat job.yaml

      - name: Recreate Job
        # Job spec은 대부분 immutable이라 kubectl apply로 갱신할 수 없다.
        # infra#346의 RBAC도 delete/create 전제로 부여돼 있다.
        env:
          JOB_NAME: ${{ steps.manifest.outputs.job_name }}
        shell: bash
        run: |
          kubectl delete job "$JOB_NAME" -n "$FEAST_APPLY_NAMESPACE" \
            --ignore-not-found --wait=true --timeout=120s
          kubectl create -f job.yaml

      - name: Wait for Job result
        id: wait
        # kubectl wait --for=condition=complete는 실패 시 조건이 서지 않아
        # 타임아웃까지 대기하고 원인을 "timeout"으로 오인시킨다. complete와
        # failed 양쪽을 함께 본다.
        env:
          JOB_NAME: ${{ steps.manifest.outputs.job_name }}
        shell: bash
        run: |
          # Job의 activeDeadlineSeconds(1500)보다 길게 잡아, 멈춘 Job이 GHA
          # 타임아웃이 아니라 Job Failed 조건으로 판정되게 한다.
          deadline=$((SECONDS + 1620))
          result="timeout"
          while (( SECONDS < deadline )); do
            complete="$(kubectl get job "$JOB_NAME" -n "$FEAST_APPLY_NAMESPACE" \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' || true)"
            failed="$(kubectl get job "$JOB_NAME" -n "$FEAST_APPLY_NAMESPACE" \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' || true)"
            if [[ "$complete" == "True" ]]; then
              result="complete"
              break
            fi
            if [[ "$failed" == "True" ]]; then
              result="failed"
              break
            fi
            sleep 10
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "job result: $result"

      - name: Collect Job logs
        if: always()
        # 이미지 풀·스케줄 실패로 로그가 비는 경우가 있으므로 실패를 허용한다.
        env:
          JOB_NAME: ${{ steps.manifest.outputs.job_name }}
        shell: bash
        run: |
          kubectl logs "job/$JOB_NAME" -n "$FEAST_APPLY_NAMESPACE" \
            --all-containers --tail=-1 | tee apply.log || true
          touch apply.log

      - name: Describe Job on failure
        if: always() && steps.wait.outputs.result != 'complete'
        env:
          JOB_NAME: ${{ steps.manifest.outputs.job_name }}
        shell: bash
        run: |
          kubectl describe "job/$JOB_NAME" -n "$FEAST_APPLY_NAMESPACE" || true
          kubectl describe pods -n "$FEAST_APPLY_NAMESPACE" \
            -l "job-name=$JOB_NAME" || true

      - name: Guard against Job failure
        env:
          RESULT: ${{ steps.wait.outputs.result }}
        shell: bash
        run: |
          if [[ "$RESULT" != "complete" ]]; then
            echo "::error::feast apply Job did not complete (result=$RESULT)"
            exit 1
          fi

      - name: Guard against wrong code version (bootstrap marker)
        # Pod 실행 모드에서는 부트스트랩·Workload Identity 실패가 exit 2로
        # 드러나 위 Job 결과 가드가 잡는다. 여기서 남는 위험은 "성공했지만
        # 다른 커밋의 정의를 apply한" 경우이므로, 실행된 코드 버전을 단언한다.
        env:
          CODE_ARCHIVE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if ! grep -qF "[gcs-bootstrap] code: ${CODE_ARCHIVE_SHA}" apply.log; then
            echo "::error::Job did not run the code archive of ${CODE_ARCHIVE_SHA}"
            exit 1
          fi

      - name: Guard against silent apply failure (log pattern)
        # feast 0.64 CLI는 FeastProviderLoginError를 삼키고 exit 0으로 끝난다.
        # Job이 성공으로 끝나도 이 패턴이 있으면 apply가 실제로는 실패한 것이다.
        shell: bash
        run: |
          if grep -E 'application-default login|GCP error:' apply.log; then
            echo "::error::feast apply failed silently (FeastProviderLoginError swallowed with exit 0)"
            exit 1
          fi

      - name: Guard against silent apply failure (registry generation)
        env:
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          BEFORE_GENERATION: ${{ steps.before.outputs.generation }}
        shell: bash
        run: |
          after_generation="$(gcloud storage objects describe "$GCS_REGISTRY_PATH" \
            --format='value(generation)' 2>/dev/null || true)"
          if [[ -n "$BEFORE_GENERATION" && "$after_generation" == "$BEFORE_GENERATION" ]]; then
            echo "::error::registry generation unchanged after apply (silent failure)"
            exit 1
          fi

      # 위 두 가드는 "apply가 돌았는가"만 본다. 아래는 "의도한 내용이 들어갔는가"를 본다 —
      # #409에서 apply가 성공하고 generation도 바뀌었는데(meta만 갱신) ODFV의 dill body는
      # 그대로여서 학습이 계속 깨진 사례가 실제로 있었다. feast의 변경 감지가
      # (udf_string, 바이트코드)만 보기 때문에 헬퍼의 소속 모듈 변경을 놓친 것이라,
      # 정의 파일 쪽 가드로는 못 막고 **결과물을 읽어봐야만** 드러난다.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true

      - name: Install feast group for registry verification
        # feast 그룹은 dev 그룹과 충돌하므로 --no-dev 로 격리 설치한다(ci.yml과 동일).
        run: uv sync --frozen --no-dev --group feast

      - name: Verify the applied registry loads in the consumer import path
        env:
          GCS_REGISTRY_PATH: ${{ vars.GCS_REGISTRY_PATH }}
          BEFORE_GENERATION: ${{ steps.before.outputs.generation }}
        shell: bash
        run: |
          gcloud storage cp "$GCS_REGISTRY_PATH" applied-registry.db
          if uv run --no-sync python scripts/verify_registry_portability.py applied-registry.db; then
            exit 0
          fi
          # 이 스텝은 apply가 prod 레지스트리를 이미 덮어쓴 뒤에 돈다. 여기서 닫히는 것은
          # 배포가 아니라 "성공했다는 신호"이므로, 운영자가 바로 되돌릴 수 있게 명령을 남긴다.
          # 레지스트리 버킷은 object versioning이 켜져 있어 apply 직전 generation으로 복구된다.
          echo "prod 레지스트리는 이미 덮어써진 상태다 — 학습·materialize는 지금 이 레지스트리를 읽는다."
          if [[ -n "$BEFORE_GENERATION" ]]; then
            echo "롤백: gcloud storage cp \"${GCS_REGISTRY_PATH}#${BEFORE_GENERATION}\" \"${GCS_REGISTRY_PATH}\""
          else
            echo "롤백: gcloud storage ls -a \"$GCS_REGISTRY_PATH\" 로 apply 직전 generation을 찾아 같은 방식으로 복사"
          fi
          echo "재적용: 정의를 고쳤는데도 갱신이 안 되면 UDF의 udf_string(소스 텍스트)이나 바이트코드를 바꿔야 한다 (#409)"
          echo "::error::applied registry is not loadable by training/serving — roll back to generation ${BEFORE_GENERATION:-unknown}, then fix and re-apply (see log above)"
          exit 1
