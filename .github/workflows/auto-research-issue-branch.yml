name: Auto Research issue branch

# GitHub issues 이벤트는 기본 브랜치(main)에 있는 workflow 정의만 실행한다.
# 그러나 main은 정의의 위치일 뿐이며, validator checkout과 새 ref의 기준선은 항상 dev다.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  create-or-verify-issue-branch:
    if: >-
      contains(github.event.issue.labels.*.name, 'auto-research') &&
      contains(github.event.issue.labels.*.name, 'experiment')
    runs-on: ubuntu-latest
    concurrency:
      group: auto-research-issue-branch-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      base_dev_sha: ${{ steps.branch.outputs.base_dev_sha }}
    steps:
      - name: Checkout dev validator
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Write Issue Form body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_BODY_FILE: ${{ runner.temp }}/auto-research-issue.md
        shell: bash
        run: printf '%s' "$ISSUE_BODY" > "$ISSUE_BODY_FILE"

      - name: Validate issue execution contract
        id: validate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY_FILE: ${{ runner.temp }}/auto-research-issue.md
        shell: bash
        run: |
          python tools/auto_research_issue_branch.py \
            --issue-number "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --issue-body-file "$ISSUE_BODY_FILE"

      - name: Create or verify immutable issue branch
        id: branch
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BRANCH: ${{ steps.validate.outputs.issue_branch }}
          CRITERIA_ID: ${{ steps.validate.outputs.criteria_id }}
          REPRODUCIBILITY_ID: ${{ steps.validate.outputs.reproducibility_id }}
        with:
          script: |
            const marker = '<!-- auto-research-issue-branch:v1 -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueBranch = process.env.ISSUE_BRANCH;
            const criteriaId = process.env.CRITERIA_ID;
            const reproducibilityId = process.env.REPRODUCIBILITY_ID;

            function failClosed(message) {
              core.setFailed(message);
              throw new Error(message);
            }

            function requireMatch(value, expression, name) {
              if (!expression.test(value)) {
                failClosed(`invalid ${name}`);
              }
              return value;
            }

            function markerBody(baseDevSha) {
              return [
                marker,
                '## Auto Research issue branch',
                `- source_issue: #${issueNumber}`,
                `- issue_branch: \`${issueBranch}\``,
                `- base_dev_sha: \`${baseDevSha}\``,
                `- criteria_id: \`${criteriaId}\``,
                `- reproducibility_id: \`${reproducibilityId}\``,
              ].join('\n');
            }

            function parseMarkerComment(body) {
              if ((body.match(/<!-- auto-research-issue-branch:v1 -->/g) || []).length !== 1) {
                failClosed('issue branch marker must occur exactly once');
              }
              const match = body.match(
                /^<!-- auto-research-issue-branch:v1 -->\n## Auto Research issue branch\n- source_issue: #(\d+)\n- issue_branch: `([^`]+)`\n- base_dev_sha: `([0-9a-f]{40})`\n- criteria_id: `([0-9a-f]{64})`\n- reproducibility_id: `([0-9a-f]{64})`$/,
              );
              if (match === null) {
                failClosed('issue branch marker is malformed');
              }
              return {
                sourceIssue: Number(match[1]),
                issueBranch: match[2],
                baseDevSha: match[3],
                criteriaId: match[4],
                reproducibilityId: match[5],
              };
            }

            requireMatch(String(issueNumber), /^[1-9][0-9]*$/, 'issue number');
            requireMatch(issueBranch, /^exp\/[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*$/, 'issue branch');
            requireMatch(criteriaId, /^[0-9a-f]{64}$/, 'criteria_id');
            requireMatch(reproducibilityId, /^[0-9a-f]{64}$/, 'reproducibility_id');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const markerComments = comments.filter((comment) =>
              typeof comment.body === 'string' && comment.body.includes(marker),
            );
            if (markerComments.length > 1) {
              failClosed('multiple issue branch marker comments found');
            }

            let baseDevSha;
            if (markerComments.length === 1) {
              if (markerComments[0].user.login !== 'github-actions[bot]') {
                failClosed('issue branch marker was not created by github-actions[bot]');
              }
              const recorded = parseMarkerComment(markerComments[0].body);
              if (
                recorded.sourceIssue !== issueNumber ||
                recorded.issueBranch !== issueBranch ||
                recorded.criteriaId !== criteriaId ||
                recorded.reproducibilityId !== reproducibilityId
              ) {
                failClosed('recorded issue branch contract does not match validated issue input');
              }

              let branchRef;
              try {
                branchRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${recorded.issueBranch}`,
                });
              } catch (error) {
                if (error.status === 404) {
                  failClosed('recorded issue branch ref is missing');
                }
                throw error;
              }
              const branchTipSha = branchRef.data.object.sha;
              requireMatch(branchTipSha, /^[0-9a-f]{40}$/, 'recorded branch tip SHA');

              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: recorded.baseDevSha,
                head: branchTipSha,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                failClosed('recorded issue branch is not descended from its baseline');
              }
              baseDevSha = recorded.baseDevSha;
            } else {
              let existingBranch;
              try {
                existingBranch = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${issueBranch}`,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              if (existingBranch !== undefined) {
                failClosed('issue branch ref exists without a trusted marker comment');
              }

              const devRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/dev',
              });
              baseDevSha = devRef.data.object.sha;
              requireMatch(baseDevSha, /^[0-9a-f]{40}$/, 'dev SHA');
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${issueBranch}`,
                sha: baseDevSha,
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: markerBody(baseDevSha),
              });
            }

            core.setOutput('base_dev_sha', baseDevSha);
